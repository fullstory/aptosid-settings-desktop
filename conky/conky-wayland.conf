-- aptosid system-information panel, native Wayland (wlr-layer-shell).
-- Copy to ~/.config/conky/conky.conf to customise.

conky.config = {
    out_to_x = false,
    out_to_wayland = true,

    alignment = "top_right",
    gap_x = 24,
    gap_y = 20,

    own_window = false,                   -- layer surface with corner anchoring

    lua_load = "/usr/share/aptosid-settings-conky/conky-bg.lua",
    lua_draw_hook_pre = "draw_bg",

    update_interval = 60,

    border_inner_margin = 12,
    border_outer_margin = 0,

    font = "monospace:size=11",
    override_utf8_locale = true,
    default_color = "white",
    minimum_width = 5,
    no_buffers = true,
};

conky.text = [[
${execi 60 inxi --tty -SCMGNDIz -x}
]];
