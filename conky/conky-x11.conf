-- aptosid system-information panel: inxi summary on a rounded translucent
-- panel, top-right. Copy to ~/.config/conky/conky.conf to customise.
-- X11 sessions; Wayland sessions use conky-wayland.conf.

conky.config = {
    out_to_x = true,
    out_to_wayland = false,

    alignment = "top_right",
    xinerama_head = 0,
    gap_x = 24,
    gap_y = 20,

    own_window = true,
    own_window_type = "normal",
    own_window_colour = "#00000000",      -- transparent base; panel drawn by Lua
    own_window_hints = "undecorated,below,sticky,skip_taskbar,skip_pager",

    lua_load = "/usr/share/aptosid-settings-conky/conky-bg.lua",
    lua_draw_hook_pre = "draw_bg",

    double_buffer = true,
    background = false,
    update_interval = 60,

    border_inner_margin = 12,
    border_outer_margin = 0,

    use_xft = true,
    font = "monospace:size=11",
    override_utf8_locale = true,
    default_color = "white",
    minimum_width = 5,
    no_buffers = true,
};

conky.text = [[
${execi 60 inxi --tty -SCMGNDIz -x}
]];
